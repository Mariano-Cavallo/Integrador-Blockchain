name: CI

on:
  push:
  pull_request:

jobs:
  # Escaneo de secrets: si hay un secret hardcodeado, el pipeline falla.
  gitleaks:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: gitleaks escanea todos los commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Pruebas del NCT. La mayoria usan fakeredis; los tests de /health y rate limiting
  # (Mejora 5) necesitan un Redis real (el rate limiter de slowapi usa Redis como storage
  # compartido entre replicas, no un mock en memoria) - DB 15, aislada de cualquier otra cosa.
  tests:
    name: Tests NCT (Pilar 2)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: Pilar2/nct
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v
