name: CI

on:
  push:
  pull_request:

jobs:
  # Escaneo de secrets: si hay un secret hardcodeado, el pipeline falla.
  gitleaks:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: gitleaks escanea todos los commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Pruebas del NCT. Usan fakeredis.
  tests:
    name: Tests NCT (Pilar 2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Pilar2/nct
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v
