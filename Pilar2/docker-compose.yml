services:
  redis:
    image: redis:7
    container_name: PopToken-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: PopToken-rabbitmq
    ports:
      - "5672:5672"     # puerto AMQP (lo usa pika)
      - "15672:15672"   # UI web de administracion
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Worker CPU: consume tareas de mining_tasks, mina y publica en mining_results.
  # Escalable con --scale worker-cpu=N (varios mineros compitiendo por las tareas).
  worker-cpu:
    build:
      context: ./worker            # ve common/, cpu/, requirements.txt
      dockerfile: cpu/Dockerfile
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/   # host = nombre del servicio
    depends_on:
      rabbitmq:
        condition: service_healthy   # espera a que RabbitMQ este listo
    restart: unless-stopped          # si el worker se cae, lo reinicia

  # Worker GPU local: NO se conecta al RabbitMQ de este compose, se conecta directo a la
  # cola real de la nube (rabbitmq-external) - mina tareas reales, junto al worker-cpu de
  # GKE y al worker-gpu del profe (que sigue corriendo aparte, sin tocar nada de eso).
  # RABBITMQ_PASS sale de un .env local (no commiteado) - pedirla a quien tenga acceso a
  # los GitHub Secrets del repo. No se levanta con `docker compose up -d` solo (no tiene
  # profiles ni depends_on de nada local); se activa a mano: `docker compose up -d worker-gpu`.
  worker-gpu:
    build:
      context: ./worker
      dockerfile: gpu/Dockerfile
      args:
        CUDA_ARCH: ${CUDA_ARCH:-sm_89}   # RTX 4050 Laptop (Ada Lovelace) por default; ajustar segun la placa
    environment:
      RABBITMQ_URL: "amqps://poptoken:${RABBITMQ_PASS}@34.60.164.228:5671/"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # API del NCT (FastAPI + UI). No corre el consumidor (ese es nct-consumer).
  nct-api:
    build: ./nct
    container_name: PopToken-nct-api
    ports:
      - "8888:8888"
    environment:
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Consumidor de mining_results: sella bloques. Misma imagen, distinto comando.
  nct-consumer:
    build: ./nct
    container_name: PopToken-nct-consumer
    command: ["python", "-m", "scripts.run_consumer"]
    environment:
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - nct-api
      - nct-consumer
      - worker-cpu

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

volumes:
  redis-data:
