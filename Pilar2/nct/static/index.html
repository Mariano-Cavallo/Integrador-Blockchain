<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PopToken — Explorador</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #21262d;
      --txt: #e6edf3; --muted: #7d8590; --accent: #6e8efb;
      --ok: #3fb950; --err: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--txt); min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      line-height: 1.55; font-size: 14px;
    }
    header {
      padding: 16px 28px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header .sub { color: var(--muted); font-size: 13px; }
    .bar { margin-left: auto; display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
    .bar span { display: flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--err); }
    .dot.ok { background: var(--ok); }

    main { max-width: 980px; margin: 0 auto; padding: 28px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    .panel h2 { margin: 0 0 18px; font-size: 13px; color: var(--muted); font-weight: 600; }

    .stats { display: flex; gap: 48px; margin-bottom: 18px; }
    .stat .num { font-size: 32px; font-weight: 600; line-height: 1; }
    .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 6px; }

    label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
    input, select {
      width: 100%; padding: 9px 11px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg); color: var(--txt); font-size: 14px;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    button {
      border: 1px solid var(--border); cursor: pointer; margin-top: 14px; padding: 9px 16px;
      border-radius: 6px; font-size: 14px; font-weight: 500;
      background: var(--accent); color: #fff; border-color: transparent;
    }
    button:hover { opacity: .9; }
    button.full { width: 100%; }
    button.secondary { background: transparent; color: var(--txt); border-color: var(--border); }
    button.secondary:hover { border-color: var(--accent); }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
    .msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--err); }

    .block { border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
    .block.genesis { border-style: dashed; }
    .block .head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .block .idx { background: var(--bg); border: 1px solid var(--border); font-weight: 600; border-radius: 5px; padding: 2px 9px; font-size: 13px; }
    .hash { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
    .pill { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 12px; padding: 1px 9px; }
    .tx { border-top: 1px solid var(--border); padding: 8px 0 0; margin-top: 8px; font-size: 13px; }
    .tx .type { color: var(--accent); font-weight: 500; }
    .empty { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>PopToken</h1>
    <span class="sub">· Blockchain Explorer</span>
    <div class="bar">
      <span><span class="dot" id="dot-redis"></span>Redis</span>
      <span><span class="dot" id="dot-rabbit"></span>RabbitMQ</span>
    </div>
  </header>

  <main>
    <div class="panel">
      <h2>Estado de la red</h2>
      <div class="stats">
        <div class="stat"><div class="num" id="st-height">–</div><div class="lbl">Altura de la cadena</div></div>
        <div class="stat"><div class="num" id="st-pending">–</div><div class="lbl">Tx pendientes</div></div>
      </div>
      <button class="secondary full" onclick="formarBloque()">Formar bloque — minar pendientes</button>
      <div class="msg" id="msg-block"></div>
    </div>

    <div class="grid">
      <div class="panel">
        <h2>Enviar transacción</h2>
        <label>Tipo</label>
        <select id="tx-type" onchange="renderTxForm()">
          <option value="emision">Emisión (cine)</option>
          <option value="transferencia">Transferencia</option>
          <option value="canje">Canje</option>
        </select>
        <div id="tx-fields"></div>
        <button class="full" onclick="enviarTx()">Enviar</button>
        <div class="msg" id="msg-tx"></div>
      </div>

      <div class="panel">
        <h2>Consultar saldo</h2>
        <label>Wallet</label>
        <input id="bal-wallet" placeholder="ej. Alice">
        <button class="full" onclick="consultarSaldo()">Consultar</button>
        <div class="msg" id="msg-bal"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Cadena de bloques</h2>
      <div id="chain"></div>
    </div>
  </main>

  <script>
    const API = "";

    async function api(path, opts) {
      const res = await fetch(API + path, opts);
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.detail || res.statusText);
      return body;
    }

    async function refreshStatus() {
      try {
        const s = await api("/status");
        document.getElementById("st-height").textContent = s.height;
        document.getElementById("st-pending").textContent = s.pending;
      } catch (e) {}
      try {
        const h = await api("/health");
        setDot("dot-redis", h.redis);
        setDot("dot-rabbit", h.rabbitmq);
      } catch (e) { setDot("dot-redis", "down"); setDot("dot-rabbit", "down"); }
    }
    function setDot(id, st) {
      document.getElementById(id).className = "dot" + (st === "ok" ? " ok" : "");
    }

    function renderTxForm() {
      const t = document.getElementById("tx-type").value;
      const f = document.getElementById("tx-fields");
      let html = `
        <label>From (origen)</label><input id="f-from" placeholder="${t === 'emision' ? 'cine emisor' : 'wallet origen'}">
        <label>To (destino)</label><input id="f-to" placeholder="wallet destino">
        <label>Tokens</label><input id="f-tokens" type="number" value="10">`;
      if (t === "emision") {
        html += `<div class="row"><div><label>Motivo</label><input id="f-motivo" value="compra_entrada"></div>
                 <div><label>Película</label><input id="f-pelicula" value="Dune"></div></div>`;
      } else if (t === "canje") {
        html += `<label>Beneficio</label><input id="f-beneficio" value="entrada_gratis">`;
      }
      f.innerHTML = html;
    }

    async function enviarTx() {
      const t = document.getElementById("tx-type").value;
      const tx = {
        type: t, from: val("f-from"), to: val("f-to"),
        tokens: parseInt(val("f-tokens"), 10), timestamp: new Date().toISOString(),
      };
      if (t === "emision") { tx.motivo = val("f-motivo"); tx.pelicula = val("f-pelicula"); }
      if (t === "canje") { tx.beneficio = val("f-beneficio"); }
      const m = document.getElementById("msg-tx");
      try {
        await api("/tx", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(tx) });
        m.className = "msg ok"; m.textContent = "✓ Transacción aceptada y encolada.";
        refreshStatus();
      } catch (e) { m.className = "msg err"; m.textContent = "✗ " + e.message; }
    }

    async function consultarSaldo() {
      const w = val("bal-wallet");
      const m = document.getElementById("msg-bal");
      if (!w) { m.className = "msg err"; m.textContent = "Ingresá una wallet."; return; }
      try {
        const r = await api("/balance/" + encodeURIComponent(w));
        m.className = "msg ok"; m.textContent = `Saldo de ${r.wallet}: ${r.saldo} tokens`;
      } catch (e) { m.className = "msg err"; m.textContent = "✗ " + e.message; }
    }

    async function formarBloque() {
      const m = document.getElementById("msg-block");
      try {
        const r = await api("/block", { method: "POST" });
        m.className = "msg ok";
        m.textContent = `✓ Bloque ${r.block_index ?? ""} formado · tarea de PoW publicada. Esperando minero…`;
        setTimeout(() => { refreshStatus(); refreshChain(); }, 1500);
      } catch (e) { m.className = "msg err"; m.textContent = "✗ " + e.message; }
    }

    async function refreshChain() {
      const cont = document.getElementById("chain");
      try {
        const c = await api("/chain");
        let html = renderGenesis();
        if (!c.blocks || c.blocks.length === 0) {
          html += `<p class="empty">Todavía no hay bloques minados.</p>`;
        } else {
          html += c.blocks.map(renderBlock).join("");
        }
        cont.innerHTML = html;
      } catch (e) { cont.innerHTML = `<p class="empty">No se pudo cargar la cadena: ${e.message}</p>`; }
    }
    function renderGenesis() {
      return `<div class="block genesis"><div class="head"><span class="idx">G</span><strong>Génesis</strong></div>
              <div class="hash">origen de la cadena — define emisores autorizados y reglas</div></div>`;
    }
    function renderBlock(b) {
      const txs = (b.transactions || []).map(tx => `
        <div class="tx"><span class="type">${tx.type}</span>
        ${tx.from ? `· ${tx.from} → ${tx.to}` : ""} ${tx.tokens != null ? `· <b>${tx.tokens}</b> tokens` : ""}</div>`).join("");
      return `<div class="block">
        <div class="head"><span class="idx">#${b.index}</span>
          <span class="pill">nonce ${b.nonce}</span>
          <span class="pill">${(b.transactions||[]).length} tx</span></div>
        <div class="hash">hash ${b.block_hash}</div>
        <div class="hash">prev ${b.previous_hash}</div>
        ${txs}
      </div>`;
    }

    function val(id) { return document.getElementById(id).value.trim(); }

    renderTxForm();
    refreshStatus();
    refreshChain();
    setInterval(refreshStatus, 4000);
  </script>
</body>
</html>
