apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Servidor ACME de Let's Encrypt (producción)
    server: https://acme-v02.api.letsencrypt.org/directory
    # Email para avisos de expiración / problemas (poné el tuyo)
    email: mariano22xd@gmail.com
    # Donde cert-manager guarda la clave privada de la cuenta ACME
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    # Resolución del challenge vía HTTP-01 sobre el Ingress nginx
    solvers:
      - http01:
          ingress:
            class: nginx
