apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
data:
  rabbitmq.conf: |
    # Modo standalone (1 replica): sin peer discovery K8s para evitar el bug
    # de RabbitMQ 3.13 + GKE 1.35 (badkey:hostname). Volver a activar cluster
    # formation cuando se use el RabbitMQ Cluster Operator.
    cluster_name = blockchain-rabbit
    queue_master_locator = min-masters
    loopback_users.guest = false
  enabled_plugins: |
    [rabbitmq_management].
